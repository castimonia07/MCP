version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "castimonia07", email = "rpandey126.jpsv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.33.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.2",
    "langchain[mcp]>=1.3.18",
    "langgraph>=1.2.17",
    "mcp>=1.30.0",
    "mcp-use>=1.7.1",
    "openai>=3.39.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
mcp-gaurdrails = "mcp_gaurdrails:main"

[build-system]
